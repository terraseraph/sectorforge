name: Release

# Push a tag like v0.2.0 to build and publish a release.
# Every push to master rebuilds the "nightly" pre-release, so the latest master is always downloadable.
# Run manually (Actions > Release > Run workflow) to build the packages without publishing.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# A newer master push replaces an unfinished nightly build; tagged releases always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/master' }}

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: cargo build --release -p sf-cli
      - run: npm ci
        working-directory: gui
      - run: npx tauri build --no-bundle
        working-directory: gui
      - name: Package
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "nightly" }
          New-Item -ItemType Directory -Force out | Out-Null
          # One portable exe: the engine is built in (it runs itself with `sf-cli` as the first argument).
          Copy-Item gui/src-tauri/target/release/sectorforge-gui.exe "out/SectorForge-$ver-windows-x64.exe"
          Compress-Archive target/release/sf-cli.exe, README.md, LICENSE "out/sf-cli-$ver-windows-x64.zip"
      - name: Check the exe runs its built-in engine
        shell: pwsh
        run: |
          $exe = Get-ChildItem out/SectorForge-*-windows-x64.exe | Select-Object -First 1
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe.FullName, "sf-cli version --json"
          $psi.UseShellExecute = $false; $psi.RedirectStandardOutput = $true; $psi.CreateNoWindow = $true
          $p = [System.Diagnostics.Process]::Start($psi); $out = $p.StandardOutput.ReadToEnd(); $p.WaitForExit()
          Write-Host $out
          if ($p.ExitCode -ne 0 -or $out -notmatch '"contract":2') { throw "built-in engine check failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux AppImage + static CLI
    # Oldest supported runner: the AppImage then runs on any distro with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      # One fully static sf-cli: shipped on its own and inside the AppImage.
      - run: cargo build --release -p sf-cli --target x86_64-unknown-linux-musl
      - name: Stage static sf-cli as the GUI sidecar
        run: |
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/sf-cli target/release/sf-cli
      - run: npm ci && npm run stage-sidecar
        working-directory: gui
      - run: npx tauri build --bundles appimage
        working-directory: gui
        env:
          # The AppImage tooling is itself an AppImage; runners have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Package
        run: |
          ver=$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo nightly)
          mkdir -p out
          cp gui/src-tauri/target/release/bundle/appimage/*.AppImage "out/SectorForge-$ver-x86_64.AppImage"
          chmod +x "out/SectorForge-$ver-x86_64.AppImage"
          tar -czf "out/sf-cli-$ver-linux-x86_64-static.tar.gz" README.md LICENSE \
            -C target/x86_64-unknown-linux-musl/release sf-cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Replace the nightly pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "SectorForge nightly (${GITHUB_SHA::7})" \
            --notes "Built from the latest commit on master. Not a tested release; the stable one is under Latest."
      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "SectorForge $GITHUB_REF_NAME"
          --generate-notes
