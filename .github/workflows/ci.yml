name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  engine:
    name: Engine + CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Raw block device test against a loop device
        if: runner.os == 'Linux' && hashFiles('scripts/linux-loopdev-test.sh') != ''
        run: bash scripts/linux-loopdev-test.sh

  gui:
    name: GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            gui/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
      - run: npm test
      - run: npm run build
      # On Linux the sidecar is declared in tauri.linux.conf.json, and Tauri checks it exists at build time.
      - name: Stage sf-cli sidecar
        if: runner.os == 'Linux'
        run: |
          cargo build --release -p sf-cli --manifest-path ../Cargo.toml
          npm run stage-sidecar
      - run: cargo test
        working-directory: gui/src-tauri
