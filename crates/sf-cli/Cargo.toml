[package]
name = "sf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SectorForge command-line imaging tool"

[[bin]]
name = "sf-cli"
path = "src/main.rs"

[dependencies]
sf-core = { path = "../sf-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
