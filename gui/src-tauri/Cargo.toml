[package]
name = "sectorforge-gui"
version = "0.3.0"
edition = "2021"

[lib]
name = "sectorforge_gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The engine, embedded so Windows ships one portable exe (see EMBEDDED_ARG in cli.rs).
sf-cli = { path = "../../crates/sf-cli" }
sf-core = { path = "../../crates/sf-core" }
